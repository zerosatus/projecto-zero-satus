<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛠️ Em Manutenção</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           ESTILOS DA TELA DE MANUTENÇÃO
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* 🌟 FUNDO COM PARTÍCULAS/ORBS */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        
        .bg-orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
            top: -150px;
            left: -100px;
        }
        
        .bg-orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.15) 0%, transparent 70%);
            bottom: -50px;
            right: -50px;
        }
        
        .bg-orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.12) 0%, transparent 70%);
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* 📦 CONTAINER PRINCIPAL */
        .maintenance-container {
            position: relative;
            z-index: 1;
            max-width: 440px;
            width: 100%;
            padding: 30px 24px;
            text-align: center;
        }
        
        /* 🔧 ÍCONE ANIMADO */
        .maintenance-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: block;
            animation: gearSpin 6s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.4));
        }
        
        @keyframes gearSpin {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(15deg) scale(1.05); }
            50% { transform: rotate(-10deg) scale(0.95); }
            75% { transform: rotate(5deg) scale(1.02); }
            100% { transform: rotate(0deg) scale(1); }
        }
        
        /* 🏷️ TÍTULO */
        .maintenance-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .maintenance-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            margin-bottom: 20px;
        }
        
        /* 📝 DESCRIÇÃO */
        .maintenance-description {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 0 8px;
        }
        
        /* ⏱️ TEMPO ESTIMADO */
        .maintenance-time {
            display: inline-block;
            padding: 10px 24px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 100px;
            font-size: 14px;
            color: #a78bfa;
            font-weight: 500;
            margin-bottom: 24px;
            animation: pulseTime 2s ease-in-out infinite;
        }
        
        @keyframes pulseTime {
            0%, 100% { box-shadow: 0 0 10px rgba(139, 92, 246, 0.2); }
            50% { box-shadow: 0 0 25px rgba(139, 92, 246, 0.5); }
        }
        
        /* 📊 BARRA DE PROGRESSO */
        .progress-container {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 24px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, #a78bfa, #60a5fa);
            border-radius: 20px;
            width: 0%;
            animation: progressAnim 3s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        
        @keyframes progressAnim {
            0% { width: 15%; }
            50% { width: 65%; }
            70% { width: 80%; }
            100% { width: 15%; }
        }
        
        /* 📊 INFO ADICIONAL */
        .maintenance-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .info-item i {
            color: #a78bfa;
            font-size: 14px;
        }
        
        /* 🔄 BOTÃO RECARREGAR */
        .btn-reload {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 25px rgba(139, 92, 246, 0.4);
            margin-bottom: 16px;
        }
        
        .btn-reload:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(139, 92, 246, 0.6);
        }
        
        .btn-reload:active {
            transform: scale(0.96);
        }
        
        .btn-reload i {
            font-size: 18px;
        }
        
        /* 📧 CONTATO */
        .maintenance-contact {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
        }
        
        .maintenance-contact a {
            color: #a78bfa;
            text-decoration: none;
        }
        
        .maintenance-contact a:hover {
            text-decoration: underline;
        }
        
        /* 🕹️ CONTROLE ADMIN (escondido) */
        .admin-controls {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .admin-toggle-btn {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: rgba(239, 68, 68, 0.6);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .admin-toggle-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }
        
        .admin-toggle-btn i {
            margin-right: 6px;
        }
        
        /* 📱 RESPONSIVO */
        @media (max-width: 480px) {
            .maintenance-icon {
                font-size: 56px;
            }
            
            .maintenance-title {
                font-size: 22px;
            }
            
            .maintenance-subtitle {
                font-size: 14px;
            }
            
            .maintenance-description {
                font-size: 14px;
                padding: 0 4px;
            }
            
            .maintenance-time {
                font-size: 13px;
                padding: 8px 18px;
            }
            
            .maintenance-info {
                gap: 12px;
            }
            
            .info-item {
                font-size: 11px;
                padding: 4px 12px;
            }
            
            .btn-reload {
                padding: 12px 28px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- 🌟 ORBS DE FUNDO -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- 📦 CONTEÚDO PRINCIPAL -->
    <div class="maintenance-container">
        
        <!-- 🔧 Ícone -->
        <span class="maintenance-icon">🛠️</span>
        
        <!-- 🏷️ Títulos -->
        <h1 class="maintenance-title" id="maint-title">🛠️ Em Manutenção</h1>
        <p class="maintenance-subtitle" id="maint-subtitle">Estamos melhorando sua experiência!</p>
        
        <!-- 📝 Descrição -->
        <p class="maintenance-description" id="maint-description">
            Estamos realizando uma atualização no sistema para trazer novas funcionalidades e melhorias. Volte em breve!
        </p>
        
        <!-- ⏱️ Tempo estimado -->
        <div class="maintenance-time" id="maint-time">
            <i class="fas fa-clock" style="margin-right: 8px;"></i>
            Tempo estimado: 30 minutos
        </div>
        
        <!-- 📊 Barra de progresso -->
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <!-- 📊 Info adicional -->
        <div class="maintenance-info">
            <div class="info-item">
                <i class="fas fa-users"></i>
                <span>Equipe trabalhando</span>
            </div>
            <div class="info-item">
                <i class="fas fa-code"></i>
                <span>Atualização v2.5</span>
            </div>
            <div class="info-item">
                <i class="fas fa-shield-alt"></i>
                <span>Segurança reforçada</span>
            </div>
        </div>
        
        <!-- 🔄 Botão recarregar -->
        <button class="btn-reload" onclick="verificarManutencao()">
            <i class="fas fa-sync-alt"></i>
            Verificar novamente
        </button>
        
        <!-- 📧 Contato -->
        <p class="maintenance-contact" id="maint-contact">
            📧 Para dúvidas: <a href="mailto:suporte@zerosatus.com">suporte@zerosatus.com</a>
        </p>
        
        <!-- 🕹️ Controle Admin (apenas visível se for admin) -->
        <div class="admin-controls" id="admin-controls" style="display:none;">
            <button class="admin-toggle-btn" onclick="desativarManutencao()">
                <i class="fas fa-power-off"></i>
                Desativar modo manutenção
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS                                     -->
    <!-- ========================================== -->
    
    <!-- Configuração -->
    <script src="maintenance-config.js"></script>
    
    <script>
        // ============================================
        // INICIALIZAR TELA
        // ============================================
        function initMaintenancePage() {
            console.log('[Maintenance] 🛠️ Tela de manutenção carregada');
            
            // Carregar mensagens do config
            const config = window.MAINTENANCE_CONFIG || {};
            const msgs = config.messages || {};
            
            if (msgs.title) {
                document.getElementById('maint-title').textContent = msgs.title;
            }
            if (msgs.subtitle) {
                document.getElementById('maint-subtitle').textContent = msgs.subtitle;
            }
            if (msgs.description) {
                document.getElementById('maint-description').textContent = msgs.description;
            }
            if (msgs.estimatedTime) {
                document.getElementById('maint-time').innerHTML = `<i class="fas fa-clock" style="margin-right: 8px;"></i> ${msgs.estimatedTime}`;
            }
            if (msgs.contact) {
                const contactEl = document.getElementById('maint-contact');
                if (contactEl) {
                    const email = msgs.contact.replace('📧 ', '');
                    contactEl.innerHTML = `📧 Para dúvidas: <a href="mailto:${email}">${email}</a>`;
                }
            }
            
            // Verificar se é admin para mostrar controle
            verificarAdmin();
        }
        
        // ============================================
        // VERIFICAR ADMIN
        // ============================================
        async function verificarAdmin() {
            try {
                const usuario = localStorage.getItem('usuarioLogado');
                if (usuario) {
                    const user = JSON.parse(usuario);
                    if (user.role === 'admin' || user.email === 'projectozerosatus@gmail.com') {
                        document.getElementById('admin-controls').style.display = 'block';
                        console.log('[Maintenance] 👑 Admin detectado, controles disponíveis');
                    }
                }
            } catch(e) {
                console.warn('[Maintenance] Erro ao verificar admin:', e);
            }
        }
        
        // ============================================
        // VERIFICAR MANUTENÇÃO
        // ============================================
        function verificarManutencao() {
            console.log('[Maintenance] 🔄 Verificando status...');
            
            // Mostrar spinner no botão
            const btn = document.querySelector('.btn-reload');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
            btn.disabled = true;
            
            setTimeout(() => {
                // Verificar se ainda está em manutenção
                const stillInMaintenance = window.isMaintenanceMode ? window.isMaintenanceMode() : false;
                
                if (!stillInMaintenance) {
                    console.log('[Maintenance] ✅ Manutenção desativada, redirecionando...');
                    window.location.href = 'inicio/index.html';
                } else {
                    console.log('[Maintenance] 🔴 Manutenção ainda ativa');
                    btn.innerHTML = '<i class="fas fa-sync-alt"></i> Verificar novamente';
                    btn.disabled = false;
                    
                    // Feedback visual
                    const timeEl = document.getElementById('maint-time');
                    timeEl.innerHTML = '<i class="fas fa-check-circle" style="color: #10b981;"></i> Ainda em manutenção...';
                    timeEl.style.borderColor = '#10b981';
                    timeEl.style.color = '#10b981';
                    
                    setTimeout(() => {
                        timeEl.innerHTML = '<i class="fas fa-clock" style="margin-right: 8px;"></i> Tempo estimado: 30 minutos';
                        timeEl.style.borderColor = '';
                        timeEl.style.color = '';
                    }, 3000);
                }
            }, 1500);
        }
        
        // ============================================
        // DESATIVAR MANUTENÇÃO (ADMIN)
        // ============================================
        function desativarManutencao() {
            if (!confirm('⚠️ Deseja desativar o modo manutenção?')) {
                return;
            }
            
            console.log('[Maintenance] 🔓 Desativando manutenção via admin...');
            
            // Usar a função global se disponível
            if (window.setMaintenanceMode) {
                window.setMaintenanceMode(false);
            } else {
                // Fallback: marcar no localStorage e recarregar
                localStorage.setItem('maintenance_mode', JSON.stringify({
                    enabled: false,
                    message: '',
                    timestamp: new Date().toISOString()
                }));
                localStorage.setItem('maintenance_override', 'false');
                window.location.reload();
            }
        }
        
        // ============================================
        // ESCUTAR MUDANÇAS DE STATUS (outras abas)
        // ============================================
        window.addEventListener('storage', (e) => {
            if (e.key === 'maintenance_mode' || e.key === 'maintenance_override') {
                console.log('[Maintenance] 📡 Mudança detectada:', e.key);
                
                try {
                    const data = JSON.parse(e.newValue);
                    if (data && data.enabled === false) {
                        console.log('[Maintenance] ✅ Manutenção desativada, redirecionando...');
                        setTimeout(() => {
                            window.location.href = 'inicio/index.html';
                        }, 500);
                    }
                } catch(e) {
                    // Ignorar
                }
            }
        });
        
        // ============================================
        // INICIAR
        // ============================================
        document.addEventListener('DOMContentLoaded', initMaintenancePage);
        
        // Se o DOM já estiver carregado, iniciar agora
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            initMaintenancePage();
        }
        
        console.log('[Maintenance] 🛠️ Página de manutenção pronta!');
    </script>
</body>
</html>
